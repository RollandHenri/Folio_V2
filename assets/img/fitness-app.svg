  <rect x="1180" y="430" width="300" height="210" rx="18" fill="#FFFFFF" stroke="#E8E6DF"/>
  <text x="1204" y="460" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#8A8F84">PROGRESSION</text>
