  <text x="396" y="370" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111310" text-anchor="end">62 bpm</text>
  <line x1="144" y1="388" x2="396" y2="388" stroke="#EFEDE6"/>
  <circle cx="153" cy="412" r="6" fill="none" stroke="#111310" stroke-width="2"/>
